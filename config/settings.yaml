# =============================================================================
# 解析の既定値・閾値(要件定義書 E-07、第12節)
# =============================================================================
# - Windows 側では、ローカル作業フォルダにコピーしたこのファイルを調整する。
# - 書かなかった項目は既定値になる。変更後は python anomaly_cli.py check で確認する。
# =============================================================================

# --- 販社(G-04, G-12) ---
japan_sales_companies: [CMJ]                         # 日本の販社
internal_comment_excluded_sales_companies: [CMJ]     # 内部コメントを LLM に渡さない販社

# --- 分類(G-19, G-22, G-26) ---
batch_size: 10              # 1回の Dify 呼び出しで送る修理の数
single_retry_max: 2         # エラーの修理を1件ずつ送り直す最大回数
failed_warn_ratio: 0.05     # 分類不可がこの割合を超えたら、解析の前に確認する

# --- 精度確認・代表事例(G-14, T-08) ---
sample_per_language: 20     # 抜き取り確認で、言語ごとに抽出する件数
random_seed: 42             # 抽出に使う乱数の種(同じ結果を再現するため)
examples_per_finding: 3     # 注目点ごとに示す代表事例の数

# --- 使用期間(S-08)。シリアルの変換は別ツール(シリアル変換ツール)で行う ---
usage_max_months: 96           # 使用期間(月)がこれを超えるものは使用期間の解析から除く

# --- 共通(A-04, A-23) ---
rare_code_min: 5            # 組み合わせ内でこの件数未満のコードは「その他(少数)」にまとめる
keep_top_codes: 5           # ただし件数の多い上位この数の種類は、少なくてもまとめない(0 なら上位も件数どおりにまとめる)

# --- 観点1: 全体の偏りの説明(A-05a) ---
concentration_high_pct: 50  # 最も多い故障の種類の割合がこれ以上なら「集中しています」と書く
concentration_low_pct: 30   # 最も多い故障の種類の割合がこれ未満なら「偏りは小さい」と書く
region_diff_note_pt: 20     # 2群で販社の割合の差がこのポイント以上なら注記する

# --- 観点2: 最近の修理 vs それ以前(A-07, A-08) ---
recent_months: 6            # 直近の期間(月)。受付日で数える。実行日の月は含めず、前月までを数える(例: 実行日 11月 → 5〜10月)
recent_compare: all_before  # all_before: それ以前すべてと比べる / same_length: 直前の同じ長さと比べる

# --- 観点3: 使用期間(A-11, A-13) ---
# 使用期間 = 修理の受付日の年月 − 製造年月(月単位)。直近の期間(recent_months)とは別の設定
usage_bins: [0, 7, 13, 25, 37]   # 区切りの開始月。既定: 0〜6 / 7〜12 / 13〜24 / 25〜36 / 37か月以上
usage_split_months: 24           # 使用期間をこの月数「未満」と「以上」に分けて比べる(既定: 24か月未満 / 24か月以上)。サマリーでも使う

# --- 観点4: 製造ロット(A-15a, A-15c) ---
lot_neighbor: 3             # 件数の偏りを見るとき、前後何ロットと比べるか
lot_spike_ratio: 2.0        # 前後のロットの件数の中央値の何倍以上を「参考」とするか
lot_min_n: 5                # この件数未満のロット(まとまり)は検定・件数の偏りの判定から除く
lot_window: 3               # 製造の順で隣り合う何ロットを1つのまとまりとして比べるか(1 なら、まとめての比較はしない)

# --- 注目点の条件(A-14) ---
min_group_n: 30             # 比べる2群の最低件数
alpha: 0.05                 # 補正後の p 値の基準
min_diff_pt: 10             # 割合の差の最低値(ポイント)
min_code_n: 5               # 割合が高い側の群での、そのコードの最低件数

# --- サマリーシート(tables.xlsx の先頭。A-40〜A-46、O-07) ---
summary_top_n: 10           # サマリーの表・グラフに出す故障の種類の数(全期間の件数が多い順)。残りは「上記以外」にまとめる
